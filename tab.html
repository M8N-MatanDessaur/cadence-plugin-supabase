<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="/plugins/sdk/symphonee-sdk.js"></script>
<style>
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface1); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--surface2); }
  body { margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; font-family: var(--font-ui); color: var(--text); background: var(--base); }

  .toolbar {
    height: 42px; min-height: 42px; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; background: var(--mantle); border-bottom: 1px solid var(--surface0);
  }
  .toolbar-title { font-size: 13px; font-weight: 700; color: rgb(62, 207, 142); }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--surface1); }
  .conn-dot.ok { background: var(--green); }
  .conn-dot.err { background: var(--red); }
  .project-select {
    background: var(--surface0); border: 1px solid var(--surface1); color: var(--text);
    padding: 3px 8px; border-radius: var(--radius); font: 12px var(--font-ui);
    max-width: 240px; cursor: pointer; outline: none;
  }
  .project-select:focus { border-color: var(--accent); }
  .spacer { flex: 1; }
  .btn {
    background: var(--surface1); border: 1px solid var(--overlay0); color: var(--text);
    padding: 5px 12px; border-radius: var(--radius); cursor: pointer; font: 12px var(--font-ui);
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: rgb(62, 207, 142); color: var(--crust); border-color: transparent; font-weight: 600; }
  .btn.sm { padding: 3px 10px; font-size: 11px; }
  .btn.danger { color: var(--red); }

  .tabs {
    display: flex; gap: 2px; padding: 0 12px; height: 36px; min-height: 36px;
    border-bottom: 1px solid var(--surface0); background: var(--mantle);
    overflow-x: auto; flex-wrap: nowrap;
  }
  .tab {
    padding: 0 14px; display: flex; align-items: center; font-size: 12px;
    cursor: pointer; color: var(--subtext0); border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: rgb(62, 207, 142); border-bottom-color: rgb(62, 207, 142); }

  .panel { flex: 1; overflow: auto; padding: 14px; display: none; }
  .panel.active { display: block; }

  h3 { font-size: 13px; margin: 0 0 10px; color: var(--subtext1); }
  h4 { font-size: 12px; margin: 14px 0 6px; color: var(--subtext0); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

  .sql-area { display: flex; flex-direction: column; gap: 10px; height: 100%; }
  .sql-input {
    width: 100%; height: 200px; padding: 10px; background: var(--surface0);
    border: 1px solid var(--surface1); border-radius: var(--radius); color: var(--text);
    font: 12px/1.5 'Cascadia Mono', monospace; resize: vertical; outline: none;
  }
  .sql-input:focus { border-color: var(--accent); }
  .sql-controls { display: flex; gap: 8px; align-items: center; }
  .sql-result { flex: 1; background: var(--surface0); padding: 10px; border-radius: var(--radius); overflow: auto; border: 1px solid var(--surface1); }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--surface0); }
  th { background: var(--mantle); font-weight: 600; color: var(--subtext1); position: sticky; top: 0; }
  tr:hover td { background: var(--surface0); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }

  .empty { color: var(--subtext0); padding: 20px; text-align: center; font-style: italic; }
  .err { color: var(--red); padding: 10px; background: color-mix(in srgb, var(--red) 15%, transparent); border-radius: var(--radius); }
  pre { margin: 0; font: 11px/1.4 'Cascadia Mono', monospace; white-space: pre-wrap; word-break: break-word; }
  .warn { color: var(--yellow); background: color-mix(in srgb, var(--yellow) 12%, transparent); padding: 10px; border-radius: var(--radius); margin-bottom: 10px; font-size: 11px; }
  .sub-nav { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .sub-nav button { background: var(--surface0); border: 1px solid var(--surface1); color: var(--text); padding: 4px 10px; border-radius: var(--radius); cursor: pointer; font: 11px var(--font-ui); }
  .sub-nav button.active { border-color: rgb(62, 207, 142); color: rgb(62, 207, 142); }
  .kv { font: 11px 'Cascadia Mono', monospace; color: var(--subtext1); }
  .kv b { color: var(--text); font-weight: 600; }

  /* Stats cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card {
    background: var(--surface0); border: 1px solid var(--surface1); border-radius: var(--radius);
    padding: 12px;
  }
  .card .label { font-size: 10px; color: var(--subtext0); text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { font: 18px 'Cascadia Mono', monospace; color: var(--text); margin-top: 4px; font-weight: 600; }
  .card .sub { font-size: 10px; color: var(--subtext0); margin-top: 4px; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none;
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--base); border: 1px solid var(--surface1); border-radius: var(--radius);
    padding: 18px; min-width: 420px; max-width: 640px; max-height: 80vh; overflow: auto;
  }
  .modal h3 { margin-top: 0; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 11px; color: var(--subtext1); }
  .field input, .field select, .field textarea {
    background: var(--surface0); border: 1px solid var(--surface1); border-radius: var(--radius);
    color: var(--text); padding: 6px 8px; font: 12px var(--font-ui); outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: rgb(62, 207, 142); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

  .row-actions { display: flex; gap: 4px; }
  .chip {
    display: inline-block; padding: 2px 6px; font-size: 10px; border-radius: 99px;
    background: var(--surface1); color: var(--subtext1);
  }
  .chip.ok { background: color-mix(in srgb, var(--green) 20%, transparent); color: var(--green); }
  .chip.err { background: color-mix(in srgb, var(--red) 20%, transparent); color: var(--red); }
  .chip.warn { background: color-mix(in srgb, var(--yellow) 20%, transparent); color: var(--yellow); }
</style>
</head>
<body>

<div class="toolbar">
  <span class="conn-dot" id="conn-dot"></span>
  <span class="toolbar-title">Supabase</span>
  <select class="project-select" id="project-select"></select>
  <div class="spacer"></div>
  <span class="kv" id="project-meta"></span>
  <button class="btn sm" id="refresh-btn">Refresh</button>
</div>

<div class="tabs">
  <div class="tab active" data-tab="overview">Overview</div>
  <div class="tab" data-tab="projects">Projects</div>
  <div class="tab" data-tab="orgs">Orgs</div>
  <div class="tab" data-tab="sql">SQL</div>
  <div class="tab" data-tab="tables">Tables</div>
  <div class="tab" data-tab="auth">Auth</div>
  <div class="tab" data-tab="storage">Storage</div>
  <div class="tab" data-tab="functions">Functions</div>
  <div class="tab" data-tab="stats">Stats</div>
  <div class="tab" data-tab="advisors">Advisors</div>
  <div class="tab" data-tab="secrets">Secrets</div>
  <div class="tab" data-tab="billing">Billing</div>
  <div class="tab" data-tab="config">Config</div>
</div>

<!-- Overview -->
<div class="panel active" data-panel="overview">
  <h3>Project overview</h3>
  <div id="overview-cards"><div class="empty">Loading...</div></div>
  <h4>Service health</h4>
  <div id="overview-health"><div class="empty">Loading...</div></div>
</div>

<!-- Projects -->
<div class="panel" data-panel="projects">
  <div class="sub-nav">
    <button class="btn primary sm" id="new-project-btn">+ New cloud project</button>
    <button class="btn sm" id="reload-projects">Reload</button>
  </div>
  <h4>Symphonee-registered projects</h4>
  <div id="projects-local"></div>
  <h4>Cloud projects (Management API)</h4>
  <div id="projects-cloud"></div>
</div>

<!-- Organizations -->
<div class="panel" data-panel="orgs">
  <div class="sub-nav">
    <button class="btn primary sm" id="new-org-btn">+ New organization</button>
    <button class="btn sm" id="reload-orgs">Reload</button>
  </div>
  <div id="orgs-list"></div>
  <div id="org-detail"></div>
</div>

    <textarea class="sql-input" id="sql-input" placeholder="select * from public.profiles limit 10;"></textarea>
    <div class="sql-controls">
      <button class="btn primary" id="sql-run">Run</button>
      <button class="btn sm" id="sql-run-ro">Run (read-only)</button>
      <label class="kv"><input type="checkbox" id="sql-force"> force (skip destructive gate)</label>

<!-- Tables -->

    <select class="project-select" id="schema-select"></select>
    <button class="btn sm" id="reload-tables">Reload</button>

<!-- Auth -->
<div class="panel" data-panel="auth">
  <div class="sub-nav">
    <button class="btn sm" id="reload-auth">Reload users</button>
    <button class="btn primary sm" id="new-user-btn">+ New user</button>

<div class="panel" data-panel="storage">

    <button class="btn sm" id="reload-buckets">Reload buckets</button>

<div class="panel" data-panel="stats">

<!-- Advisors -->

    <button class="btn sm" id="adv-perf">Performance</button>
  </div>
  <div id="adv-list"></div>
</div>

<!-- Secrets -->
<div class="panel" data-panel="secrets">
  <div class="sub-nav">
    <button class="btn sm" id="reload-secrets">Reload</button>
    <button class="btn primary sm" id="new-secret-btn">+ Set secret</button>

<div class="panel" data-panel="config">

    <button class="btn sm active" data-cfg="postgres">Postgres</button>
    <button class="btn sm" data-cfg="auth">Auth</button>
    <button class="btn sm" data-cfg="storage-config">Storage</button>

  </div>
  <div id="cfg-view"></div>
</div>

<!-- Modals -->
<div class="modal-backdrop" id="modal"><div class="modal" id="modal-inner"></div></div>

<script>
const API = 'http://127.0.0.1:3800/api/plugins/supabase';

// ---- helpers ----
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function fmtBytes(n) {
  if (n == null) return '-';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}
function fmtDate(d) { return d ? new Date(d).toLocaleString() : '-'; }
async function api(path, opts) {
  const r = await fetch(API + path, opts);
  const text = await r.text();
  let data; try { data = JSON.parse(text); } catch (_) { data = text; }
  return { status: r.status, data };
}

function modalOpen(html) {
  document.getElementById('modal-inner').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}
function modalClose() {
  document.getElementById('modal').classList.remove('open');
}
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') modalClose();
});

function renderRows(el, rows) {
  if (rows && rows.error) { el.innerHTML = '<div class="err">' + esc(rows.error) + '</div>'; return; }
  if (!Array.isArray(rows) || !rows.length) { el.innerHTML = '<div class="empty">No rows.</div>'; return; }
  const cols = Object.keys(rows[0]);
  el.innerHTML = '<table><thead><tr>' + cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead>'
    + '<tbody>' + rows.map(r => '<tr>' + cols.map(c => {
        const v = r[c];
        const text = v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
        const cls = (typeof v === 'number') ? ' class="num"' : '';
        return '<td' + cls + '>' + esc(text) + '</td>';
      }).join('') + '</tr>').join('') + '</tbody></table>';
}

// ---- tab switching ----
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelector('.panel[data-panel="' + t.dataset.tab + '"]').classList.add('active');
    onTabActivate(t.dataset.tab);
  });
});

// ---- header / projects ----
async function loadProjects() {
  const r = await fetch(API + '/projects').then(r => r.json());
  const sel = document.getElementById('project-select');
  sel.innerHTML = (r.projects || []).map(p =>
    `<option value="${esc(p.name)}" ${p.name === r.activeProject ? 'selected' : ''}>${esc(p.name)}</option>`
  ).join('') || '<option>-- none --</option>';
  sel.onchange = async () => {
    await fetch(API + '/projects/active', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: sel.value})
    });
    refreshHeader();
    loadOverview();
  };
  refreshHeader();
}

async function refreshHeader() {
  const test = await fetch(API + '/test').then(r => r.json());
  const dot = document.getElementById('conn-dot');
  const meta = document.getElementById('project-meta');
  if (test.project && test.project.ok) { dot.className = 'conn-dot ok'; meta.textContent = test.project.name; }
  else if (test.managementToken && test.managementToken.ok) { dot.className = 'conn-dot ok'; meta.textContent = 'PAT ok'; }
  else { dot.className = 'conn-dot err'; meta.textContent = 'not connected'; }
}

// ---- Overview ----
async function loadOverview() {
  const cardsEl = document.getElementById('overview-cards');
  const healthEl = document.getElementById('overview-health');
  cardsEl.innerHTML = '<div class="empty">Loading...</div>';
  healthEl.innerHTML = '';
  const { status, data } = await api('/stats/overview');
  if (status >= 400) { cardsEl.innerHTML = '<div class="err">' + esc((data && data.error) || 'Error') + '</div>'; return; }
  const row = Array.isArray(data) ? data[0] : data;
  const o = row && row.overview;
  if (!o) { cardsEl.innerHTML = '<div class="empty">No data.</div>'; return; }

  cardsEl.innerHTML = '<div class="cards">'
    + card('DB size', fmtBytes(o.database.size_bytes), o.database.pg_version)
    + card('Connections', o.database.connections + ' / ' + o.database.max_connections, 'live / max')
    + card('Users', o.auth.total_users, `${o.auth.confirmed} confirmed, ${o.auth.banned} banned`)
    + card('Signups 24h', o.auth.signups_24h, o.auth.active_24h + ' active 24h')
    + card('Storage', fmtBytes(o.storage.bytes), `${o.storage.buckets} buckets, ${o.storage.objects} objects`)
    + card('Public tables', o.schema_counts.public_tables, `${o.schema_counts.public_policies} policies`)
    + card('Functions', o.schema_counts.public_functions, `${o.schema_counts.triggers} triggers`)
    + card('Extensions', o.schema_counts.extensions, '')
    + '</div>';

  const h = await api('/mgmt/project/health');
  if (h.status < 400 && Array.isArray(h.data)) {
    healthEl.innerHTML = '<table><thead><tr><th>Service</th><th>Status</th><th>Healthy</th></tr></thead><tbody>'
      + h.data.map(s => `<tr><td>${esc(s.name || s.service)}</td><td><span class="chip ${s.status==='ACTIVE_HEALTHY'||s.healthy?'ok':'err'}">${esc(s.status || (s.healthy?'healthy':'down'))}</span></td><td>${s.healthy ? 'yes' : '-'}</td></tr>`).join('')
      + '</tbody></table>';
  } else {
    healthEl.innerHTML = '<div class="empty">Health info unavailable (needs Management token).</div>';
  }
}
function card(label, value, sub) {
  return `<div class="card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="sub">${esc(sub || '')}</div></div>`;
}

// ---- Projects ----
async function loadProjectsTab() {
  const local = await fetch(API + '/projects').then(r => r.json());
  const localEl = document.getElementById('projects-local');
  localEl.innerHTML = (local.projects || []).length
    ? '<table><thead><tr><th></th><th>Name</th><th>Ref</th><th>URL</th><th>Keys</th><th></th></tr></thead><tbody>'
      + local.projects.map(p => `<tr>
        <td>${p.name === local.activeProject ? '<span class="chip ok">active</span>' : ''}</td>
        <td>${esc(p.name)}</td><td class="kv">${esc(p.projectRef)}</td><td class="kv">${esc(p.url)}</td>
        <td>${p.serviceRoleKeySet ? '<span class="chip ok">sr</span>' : ''} ${p.anonKeySet ? '<span class="chip">anon</span>' : ''}</td>
        <td class="row-actions">
          <button class="btn sm" onclick="switchTo('${esc(p.name)}')">Use</button>
          <button class="btn sm danger" onclick="removeLocal('${esc(p.name)}')">Remove</button>
        </td></tr>`).join('') + '</tbody></table>'
    : '<div class="empty">No projects registered locally yet.</div>';

  const cloud = await api('/mgmt/projects');
  const cloudEl = document.getElementById('projects-cloud');
  if (cloud.status >= 400) { cloudEl.innerHTML = '<div class="err">' + esc((cloud.data && cloud.data.error) || 'Error') + '</div>'; return; }
  const list = Array.isArray(cloud.data) ? cloud.data : [];
  cloudEl.innerHTML = list.length
    ? '<table><thead><tr><th>Name</th><th>Ref</th><th>Org</th><th>Region</th><th>Plan</th><th>Status</th><th>Created</th></tr></thead><tbody>'
      + list.map(p => `<tr>
        <td>${esc(p.name)}</td><td class="kv">${esc(p.id || p.ref)}</td>
        <td class="kv">${esc(p.organization_id || '-')}</td>
        <td>${esc(p.region)}</td>
        <td>${esc(p.plan || '')}</td>
        <td>${esc(p.status || '')}</td>
        <td>${fmtDate(p.created_at)}</td>
      </tr>`).join('') + '</tbody></table>'
    : '<div class="empty">No cloud projects or Management token missing.</div>';
}
window.switchTo = async (name) => {
  await fetch(API + '/projects/active', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name}) });
  loadProjects(); loadProjectsTab();
};
window.removeLocal = async (name) => {
  if (!confirm('Remove ' + name + ' from Symphonee? (does not delete the Supabase project)')) return;
  await fetch(API + '/projects/' + encodeURIComponent(name), { method: 'DELETE' });
  loadProjectsTab();
};

async function openNewProjectModal() {
  const orgs = await api('/mgmt/organizations');
  const regions = await api('/mgmt/regions');
  const orgOpts = (Array.isArray(orgs.data) ? orgs.data : []).map(o => `<option value="${esc(o.id)}">${esc(o.name)} (${esc(o.slug)})</option>`).join('');
  const regionList = Array.isArray(regions.data) ? regions.data : [];
  const regionOpts = regionList.map(r => {
    const code = r.region || r;
    const name = r.name || code;
    return `<option value="${esc(code)}">${esc(name)} (${esc(code)})</option>`;
  }).join('');

  modalOpen(`
    <h3>Create a Supabase project</h3>
    <div class="field"><label>Name</label><input id="np-name" placeholder="my-new-project"></div>
    <div class="field"><label>Organization</label><select id="np-org">${orgOpts}</select></div>
    <div class="field"><label>Region</label><select id="np-region">${regionOpts}</select></div>
    <div class="field"><label>Database password</label><input id="np-pass" type="password" placeholder="strong password"></div>
    <div class="field"><label>Plan</label><select id="np-plan"><option value="free">Free</option><option value="pro">Pro</option><option value="team">Team</option></select></div>

async function runSql(readOnly) {
  const q = document.getElementById('sql-input').value.trim();
  const force = document.getElementById('sql-force').checked;
  if (!q) return;
  const resEl = document.getElementById('sql-result');
  resEl.innerHTML = '<div class="empty">Running...</div>';
  const endpoint = readOnly ? '/sql/select' : '/sql';
  const { status, data } = await api(endpoint, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({query: q, readOnly, force}) });
  if (status === 409 && data.confirmRequired) {
    const list = (data.destructive || []).map(d => '<li>' + esc(d.kind) + ': ' + esc(d.statement) + '</li>').join('');
    resEl.innerHTML = '<div class="warn">Destructive SQL detected:<ul>' + list + '</ul>Check "force" and re-run.</div>';
    return;
  }
  if (data && data.error) { resEl.innerHTML = '<div class="err">' + esc(data.error) + '</div>'; return; }
  renderRows(resEl, data);
}
document.getElementById('sql-run').addEventListener('click', () => runSql(false));

async function loadBilling() {
  const diskEl = document.getElementById('billing-disk');
  const addonEl = document.getElementById('billing-addons');
  diskEl.innerHTML = '<div class="empty">Loading...</div>';
  addonEl.innerHTML = '';
  const disk = await api('/mgmt/disk');
  const util = await api('/mgmt/disk/util');
  const addons = await api('/mgmt/addons');

  if (disk.status < 400 && disk.data) {
    diskEl.innerHTML = `<div class="cards">
      ${card('Disk size', fmtBytes((disk.data.size_gb || 0) * 1073741824), disk.data.type || '-')}
      ${card('IOPS', disk.data.iops || '-', 'provisioned')}
      ${card('Throughput', disk.data.throughput_mbps ? disk.data.throughput_mbps + ' MB/s' : '-', '')}
      ${card('Used', util.status < 400 && util.data && util.data.used_pct != null ? (util.data.used_pct + '%') : '-', '')}
    </div>`;
  } else {
    diskEl.innerHTML = '<div class="empty">Disk info unavailable.</div>';
  }

  if (addons.status < 400 && addons.data) {
    const selected = addons.data.selected_addons || [];
    const available = addons.data.available_addons || [];
    addonEl.innerHTML = (selected.length ? '<h4>Selected</h4>' + selected.map(a => `
      <div style="padding:8px;margin-bottom:6px;border:1px solid var(--surface1);border-radius:var(--radius)">

      </div>`).join('') : '<div class="empty">No addons selected.</div>')
      + (available.length ? '<h4>Available</h4>' + available.map(a => `
        <div style="padding:8px;margin-bottom:6px;border:1px solid var(--surface1);border-radius:var(--radius)">
          <b>${esc(a.type)}</b> - ${esc(a.name)}
        </div>`).join('') : '');
  } else {
    addonEl.innerHTML = '<div class="empty">Billing info unavailable (needs Management token + Pro plan).</div>';
  }
}

  if (name === 'overview') loadOverview();
  else if (name === 'projects') loadProjectsTab();
  else if (name === 'orgs') loadOrgs();
  else if (name === 'tables') loadSchemas();
  else if (name === 'auth') loadAuth();
  else if (name === 'storage') loadBuckets();
  else if (name === 'functions') loadFns();
  else if (name === 'stats') loadStats('db');
  else if (name === 'advisors') loadAdvisors('security');
  else if (name === 'secrets') loadSecrets();
  else if (name === 'billing') loadBilling();
  else if (name === 'config') loadCfg('postgres');
}

document.getElementById('refresh-btn').addEventListener('click', () => { loadProjects(); loadOverview(); });
document.getElementById('reload-tables').addEventListener('click', loadTables);
document.getElementById('reload-auth').addEventListener('click', loadAuth);
document.getElementById('reload-buckets').addEventListener('click', loadBuckets);
document.getElementById('reload-fns').addEventListener('click', loadFns);
document.getElementById('reload-secrets').addEventListener('click', loadSecrets);
document.getElementById('adv-sec').addEventListener('click', () => loadAdvisors('security'));
document.getElementById('adv-perf').addEventListener('click', () => loadAdvisors('performance'));

loadProjects().then(loadOverview);
</script>

</body>
</html>
